<style>
/* Maqueta: barra lateral de Home Assistant + el panel real de Cesta ocupando el resto.
   Los tokens son las variables de tema de Home Assistant, para que el panel se vea como dentro de HA. */
:root{
  --primary-background-color:#fafafa;
  --card-background-color:#ffffff;
  --secondary-background-color:#eceeed;
  --primary-text-color:#212121;
  --secondary-text-color:#6f7472;
  --divider-color:rgba(0,0,0,.12);
  --primary-color:#009ac7;
  --text-primary-color:#ffffff;
  --error-color:#db4437;
  --app-header-background-color:#fafafa;
  --app-header-text-color:#212121;
  --app-header-border-bottom:1px solid rgba(0,0,0,.12);
  --sidebar-bg:#ffffff;
  --sidebar-active:rgba(0,154,199,.12);
  --strip-bg:#eef6f9;
  --ha-font-family-body:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary-background-color:#111314;
  --card-background-color:#1c1e1f;
  --secondary-background-color:#272a2b;
  --primary-text-color:#e3e3e3;
  --secondary-text-color:#9da2a0;
  --divider-color:rgba(225,225,225,.12);
  --app-header-background-color:#111314;
  --app-header-text-color:#e3e3e3;
  --app-header-border-bottom:1px solid rgba(225,225,225,.12);
  --sidebar-bg:#1c1e1f;
  --sidebar-active:rgba(0,154,199,.22);
  --strip-bg:#14232a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --primary-background-color:#111314;
  --card-background-color:#1c1e1f;
  --secondary-background-color:#272a2b;
  --primary-text-color:#e3e3e3;
  --secondary-text-color:#9da2a0;
  --divider-color:rgba(225,225,225,.12);
  --app-header-background-color:#111314;
  --app-header-text-color:#e3e3e3;
  --app-header-border-bottom:1px solid rgba(225,225,225,.12);
  --sidebar-bg:#1c1e1f;
  --sidebar-active:rgba(0,154,199,.22);
  --strip-bg:#14232a;
  color-scheme:dark;
}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--primary-background-color);color:var(--primary-text-color);font-family:var(--ha-font-family-body);font-size:14px}
.strip{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--strip-bg);border-bottom:1px solid var(--divider-color);font-size:13px;line-height:1.4;color:var(--secondary-text-color)}
.strip p{flex:1;min-width:0;margin:0}
.strip strong{color:var(--primary-text-color);font-weight:500}
.strip button{flex:none;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--divider-color);background:var(--card-background-color);color:var(--primary-text-color);font:inherit;font-weight:500;cursor:pointer}
.strip button:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px}
.frame{flex:1;min-height:0;display:flex;position:relative}
.sidebar{flex:none;width:256px;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--divider-color)}
.sidebar .home{display:flex;align-items:center;height:56px;padding:0 20px;font-size:20px;border-bottom:1px solid var(--divider-color)}
.sidebar nav{display:grid;gap:2px;padding:8px}
.sidebar a{display:flex;align-items:center;gap:20px;height:44px;padding:0 12px;border-radius:8px;color:var(--primary-text-color);text-decoration:none;font-size:14px;font-weight:500}
.sidebar a svg{color:var(--secondary-text-color)}
.sidebar a[aria-current]{background:var(--sidebar-active);color:var(--primary-color)}
.sidebar a[aria-current] svg{color:var(--primary-color)}
.sidebar a:focus-visible{outline:2px solid var(--primary-color)}
.sidebar .grow{flex:1}
main{flex:1;min-width:0;min-height:0}
cesta-panel{display:block;height:100%}
.scrim{display:none}
@media (max-width:869px){
  .strip .long{display:none}
  .sidebar{position:absolute;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .frame.menu-open .sidebar{transform:none}
  .frame.menu-open .scrim{display:block;position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.4)}
}
@media (prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>

<script type="module">
  const { hass, backend } = window.CestaDemo;
  const panel = document.querySelector("cesta-panel");
  const frame = document.getElementById("frame");
  const narrowQuery = matchMedia("(max-width: 869px)");
  const syncNarrow = () => {
    panel.narrow = narrowQuery.matches;
    if (!narrowQuery.matches) frame.classList.remove("menu-open");
  };
  narrowQuery.addEventListener("change", syncNarrow);
  syncNarrow();
  panel.hass = hass;
  panel.addEventListener("hass-toggle-menu", () => frame.classList.toggle("menu-open"));
  document.getElementById("scrim").addEventListener("click", () => frame.classList.remove("menu-open"));
  document.querySelectorAll(".sidebar a").forEach((a) =>
    a.addEventListener("click", (e) => {
      e.preventDefault();
      frame.classList.remove("menu-open");
    })
  );
  document.getElementById("reset").addEventListener("click", () => backend.reset());
</script>
